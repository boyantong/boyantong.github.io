<link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/images/favicon-32.png" | relative_url }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ "/assets/images/favicon-192.png" | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/images/favicon-180.png" | relative_url }}">
<!-- highlight the current section in the top navigation -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var path = window.location.pathname.replace(/\/+$/, "/");
    document.querySelectorAll(".greedy-nav .visible-links a, .greedy-nav .hidden-links a").forEach(function (a) {
      var href = a.getAttribute("href");
      if (!href || href === "/") return;
      var target = new URL(href, window.location.origin).pathname.replace(/\/+$/, "/");
      if (path === target || path.indexOf(target) === 0) a.classList.add("bt-active");
    });
  });
</script>
